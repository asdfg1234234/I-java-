<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幻境启元 · 登录</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 海报舞台：角色海报 + 流动光效 + 粒子散射 + 遮罩 -->
  <div class="stage">
    <div class="poster">
      <img class="poster-img" src="poster.png" alt="游戏角色海报" />
      <!-- 眨眼叠层：贴合角色双眼位置，定时闭合模拟眨眼 -->
      <div class="eyes" aria-hidden="true">
        <span class="eye eye-l"><span class="lid"></span></span>
        <span class="eye eye-r"><span class="lid"></span></span>
      </div>
    </div>
    <div class="poster-flow"></div>
    <canvas id="particles"></canvas>
    <div class="stage-mask"></div>
  </div>

  <!-- 登录面板 -->
  <div class="screen">
    <div class="panel">
      <div class="brand">
        <div class="logo">幻</div>
        <div>
          <h1>幻境启元</h1>
          <div class="sub">ENTER THE FANTASY REALM</div>
        </div>
      </div>

      <div class="title">
        登录你的游戏账号
        <small>输入账号密码，或使用其他方式登录</small>
      </div>

      <!-- 用户名 + 密码 两行输入 -->
      <form id="loginForm" novalidate>
        <div class="field">
          <div class="control">
            <span class="ico-mini" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>
            </span>
            <input id="loginUser" type="text" placeholder="用户名 / 手机号" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <div class="control">
            <span class="ico-mini" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zM9 7a3 3 0 0 1 6 0v2H9V7zm4 11h-2v-4h2v4z"/></svg>
            </span>
            <input id="loginPwd" type="password" placeholder="密码" autocomplete="current-password" />
          </div>
        </div>

        <button class="btn btn-primary" id="btnUserLogin" type="submit" style="width:100%;">登 录</button>
      </form>

      <div class="divider"><span>其他登录方式</span></div>

      <!-- 倒数第二行：简单图标入口，手机号在最前 -->
      <div class="icon-row">
        <button class="icon-btn icon-phone" id="iconPhone" type="button" title="手机号登录" aria-label="手机号登录">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
        </button>
        <button class="icon-btn icon-qq" id="iconQQ" type="button" title="QQ登录" aria-label="QQ登录">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12.5" rx="6.6" ry="7.6" fill="#fff"/><ellipse cx="12" cy="14" rx="3.9" ry="4.9" fill="#0a3d6b"/><circle cx="9.3" cy="9.4" r="1.15" fill="#0a3d6b"/><circle cx="14.7" cy="9.4" r="1.15" fill="#0a3d6b"/><path d="M11 11.2 12.2 12.9 13.4 11.2Z" fill="#ff9f1c"/></svg>
        </button>
        <button class="icon-btn icon-wechat" id="iconWechat" type="button" title="微信登录" aria-label="微信登录">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3C4.9 3 1.6 5.8 1.6 9.1c0 1.9 1 3.6 2.7 4.7L3.1 16l2.6-1.4c.9.3 1.9.5 2.9.5h.5c-.3-.6-.5-1.3-.5-2 0-3 2.9-5.2 6.4-5.2h.3C14.8 5 12.2 3 9 3z"/><circle cx="6.4" cy="9" r="1"/><circle cx="11.4" cy="9" r="1"/><path d="M22.4 14.2c0-2.6-2.6-4.7-5.8-4.7s-5.8 2.1-5.8 4.7 2.6 4.7 5.8 4.7c.7 0 1.4-.1 2-.3l1.9 1-.5-1.6c1.5-.9 2.4-2.2 2.4-3.8z"/><circle cx="14.8" cy="14.1" r=".8"/><circle cx="18.6" cy="14.1" r=".8"/></svg>
        </button>
      </div>

      <div class="register-hint">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <!-- 手机号登录弹窗（手机号 + 短信验证码） -->
  <div class="modal" id="phoneModal">
    <div class="modal-panel">
      <button class="close" id="modalClose" type="button" aria-label="关闭">×</button>
      <div class="title">手机号登录</div>

      <div class="field" id="fldModalPhone">
        <label>手机号</label>
        <div class="control">
          <span class="prefix">+86</span>
          <input id="modalPhone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="off" />
        </div>
        <div class="error" id="modalPhoneErr"></div>
      </div>

      <div class="field">
        <label>短信验证码</label>
        <div class="control">
          <input id="modalCode" type="text" maxlength="6" placeholder="请输入验证码" autocomplete="off" />
          <button class="btn-code" id="modalGetCode" type="button">获取验证码</button>
        </div>
      </div>

      <button class="btn btn-primary" id="modalLogin" type="button" style="width:100%;margin-top:8px;">登 录</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
