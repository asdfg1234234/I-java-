<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幻境启元 · 注册</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 海报舞台（与登录页一致，保持视觉连续性） -->
  <div class="stage">
    <div class="poster">
      <img class="poster-img" src="poster.png" alt="游戏角色海报" />
      <!-- 眨眼叠层：贴合角色双眼位置，定时闭合模拟眨眼 -->
      <div class="eyes" aria-hidden="true">
        <span class="eye eye-l"><span class="lid"></span></span>
        <span class="eye eye-r"><span class="lid"></span></span>
      </div>
    </div>
    <div class="poster-flow"></div>
    <canvas id="particles"></canvas>
    <div class="stage-mask"></div>
  </div>

  <!-- 注册面板 -->
  <div class="screen">
    <div class="panel">
      <div class="brand">
        <div class="logo">幻</div>
        <div>
          <h1>创建账号</h1>
          <div class="sub">JOIN THE FANTASY REALM</div>
        </div>
      </div>

      <div class="title">注册你的游戏账号</div>

      <form id="registerForm" novalidate>
        <!-- 手机号 -->
        <div class="field" id="fldPhone">
          <label>手机号</label>
          <div class="control">
            <span class="prefix">+86</span>
            <input id="regPhone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="off" />
          </div>
          <div class="error"></div>
        </div>

        <!-- 短信验证码 -->
        <div class="field" id="fldCode">
          <label>短信验证码</label>
          <div class="control">
            <input id="regCode" type="text" maxlength="6" placeholder="请输入验证码" autocomplete="off" />
            <button class="btn-code" id="btnGetCode" type="button">获取验证码</button>
          </div>
          <div class="error"></div>
        </div>

        <!-- 密码 -->
        <div class="field" id="fldPwd">
          <label>密码</label>
          <div class="control">
            <input id="regPwd" type="password" maxlength="15" placeholder="请设置登录密码" autocomplete="new-password" />
          </div>
          <div class="hint">密码需为6—15位，且同时包含大写字母、小写字母和数字。</div>
          <div class="password-meter">
            <i></i><i></i><i></i>
          </div>
          <div class="error"></div>
        </div>

        <!-- 确认密码 -->
        <div class="field" id="fldPwd2">
          <label>确认密码</label>
          <div class="control">
            <input id="regConfirm" type="password" maxlength="15" placeholder="请再次输入密码" autocomplete="new-password" />
          </div>
          <div class="error"></div>
        </div>

        <button class="btn btn-primary" id="btnRegister" type="submit" style="width:100%;margin-top:6px;">注 册</button>
      </form>

      <div class="inline-link">
        已有账号？<a href="index.html">去登录</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
